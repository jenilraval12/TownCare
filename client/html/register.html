<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TownCare</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="register-container">

        <div class="left-section">

            <div class="logo">
                TownCare
            </div>

            <h2>
                Samudra Township, Connected.
            </h2>

            <p>
                Submit your registration request and
                become a part of the TownCare community.
                Your account will be activated after
                township administration approval.
            </p>

            <div class="town-image">
                <img src="../../images/client-login-image.jpg" alt="Samudra Township">
            </div>

        </div>


        <div class="right-section">

            <h1>
                Create Account
            </h1>

            <p class="welcome-text">
                Submit your details for administrator approval.
            </p>

            <div class="message success-message" id="successMessage"></div>

            <div class="message error-message" id="errorMessage"></div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="houseNumber">
                        House Number
                    </label>

                    <select id="houseNumber" name="houseNumber" required>
                        <option value="" disabled selected>
                            Select your house number
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="username">
                        Full Name
                    </label>

                    <input type="text" id="username" name="username" placeholder="Enter your full name" required>

                </div>


                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="Enter your mobile number"
                        maxlength="10" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Create a password" required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your password" required>

                </div>


                <button type="submit" class="register-btn">
                    Send Registration Request
                </button>

            </form>


            <p class="login-text">
                Already have an account?

                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </div>

    <script src="../js/register.js"></script>
</body>

</html>
