<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TownCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef2f1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .register-container {
            width: 900px;
            min-height: 620px;

            display: flex;

            background-color: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .left-section {
            width: 50%;

            background: #d8ebe2;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 50px;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;

            color: #1f7a4d;

            margin-bottom: 20px;
        }

        .left-section h2 {
            font-size: 30px;
            color: #23352c;

            margin-bottom: 15px;
        }

        .left-section p {
            color: #557064;

            font-size: 16px;

            line-height: 1.6;

            max-width: 340px;

            margin-bottom: 30px;
        }

        .town-image {
            width: 280px;
            height: 220px;

            background-color: #c4ddd1;

            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .town-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right-section {
            width: 50%;

            background-color: #ffffff;

            padding: 50px 70px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h1 {
            font-size: 32px;

            color: #222222;

            margin-bottom: 10px;
        }

        .welcome-text {
            color: #777777;

            font-size: 15px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            color: #555555;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            border: none;

            border-bottom: 1px solid #cccccc;

            outline: none;

            font-size: 15px;

            background-color: white;

            color: #444444;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-bottom: 2px solid #1f7a4d;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background-color: #1f7a4d;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 8px;
        }

        .register-btn:hover {
            background-color: #17613d;
        }

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 6px;

            font-size: 13px;
        }

        .success-message {
            background-color: #e5f5ec;
            color: #17613d;
        }

        .error-message {
            background-color: #ffe5e5;
            color: #c62828;
        }

        .login-text {
            text-align: center;

            color: #777777;

            font-size: 13px;

            margin-top: 20px;
        }

        .login-text a {
            color: #1f7a4d;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {

            .register-container {
                width: 100%;
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                min-height: 320px;
                padding: 40px 25px;
            }

            .right-section {
                padding: 45px 30px;
            }

            .town-image {
                width: 220px;
                height: 160px;
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .register-container {
                border-radius: 8px;
            }

            .left-section h2 {
                font-size: 25px;
            }

            .right-section h1 {
                font-size: 27px;
            }

            .right-section {
                padding: 40px 25px;
            }
        }

    </style>

</head>

<body>

    <div class="register-container">

        <div class="left-section">

            <div class="logo">
                TownCare
            </div>

            <h2>
                Samudra Township, Connected.
            </h2>

            <p>
                Submit your registration request and
                become a part of the TownCare community.
                Your account will be activated after
                township administration approval.
            </p>

            <div class="town-image">
                <img
                    src="../images/client-login-image.jpg"
                    alt="Samudra Township"
                >
            </div>

        </div>


        <div class="right-section">

            <h1>
                Create Account
            </h1>

            <p class="welcome-text">
                Submit your details for administrator approval.
            </p>

            <div
                class="message success-message"
                id="successMessage"
            ></div>

            <div
                class="message error-message"
                id="errorMessage"
            ></div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="houseNumber">
                        House Number
                    </label>

                    <select
                        id="houseNumber"
                        name="houseNumber"
                        required
                    >
                        <option value="" disabled selected>
                            Select your house number
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="username">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Send Registration Request
                </button>

            </form>


            <p class="login-text">
                Already have an account?

                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </div>


    <script>

        const houseNumber =
            document.getElementById("houseNumber");

        const blocks = ["A", "B"];

        blocks.forEach(function(block) {

            for (let building = 1; building <= 10; building++) {

                const buildingNumber =
                    String(building).padStart(2, "0");

                for (let flat = 1; flat <= 12; flat++) {

                    const option =
                        document.createElement("option");

                    option.value =
                        `${block}-${buildingNumber}/${flat}`;

                    option.textContent =
                        `${block}-${buildingNumber}/${flat}`;

                    houseNumber.appendChild(option);
                }
            }
        });


        const registerForm =
            document.getElementById("registerForm");

        const successMessage =
            document.getElementById("successMessage");

        const errorMessage =
            document.getElementById("errorMessage");


        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            successMessage.style.display = "none";
            errorMessage.style.display = "none";


            const house_no =
                houseNumber.value;

            const username =
                document.getElementById("username").value.trim();

            const phone_no =
                document.getElementById("mobileNumber").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                errorMessage.textContent =
                    "Passwords do not match.";

                errorMessage.style.display =
                    "block";

                return;
            }


            try {

                const response = await fetch(
                    "http://localhost:3000/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            house_no: house_no,
                            username: username,
                            phone_no: phone_no,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (response.ok) {

                    successMessage.textContent =
                        "Registration request submitted successfully. Please wait for admin approval.";

                    successMessage.style.display =
                        "block";

                    registerForm.reset();

                } else {

                    errorMessage.textContent =
                        data.message ||
                        "Unable to submit registration request.";

                    errorMessage.style.display =
                        "block";
                }


            } catch (error) {

                errorMessage.textContent =
                    "Unable to connect to the server.";

                errorMessage.style.display =
                    "block";

                console.error(error);
            }

        });

    </script>

</body>

</html>
